get_briefing:
  name: Read current briefing
  description: Return the selected place's current assessment for an automation or announcement. Does not operate any device. Administrator access required.
  fields:
    device_id:
      name: sScape place
      required: true
      selector:
        device:
          integration: sscape
get_dashboard:
  name: Generate place dashboard
  description: Return ready-to-import dashboard YAML using the actual entity IDs and native Home Assistant cards. Does not create or overwrite dashboards. Administrator access required.
  fields:
    device_id:
      name: sScape place
      required: true
      selector:
        device:
          integration: sscape
    all_selected_places:
      name: Include all imported places
      description: Overview and detail views for this account's explicitly imported places only.
      default: false
      selector:
        boolean:
get_outlook:
  name: Read upcoming weather windows
  description: Return cached hourly rain windows, peak one-hour gust timing and coldest hourly estimate. Forecast data, not observations or exact onset times. Administrator access required.
  fields:
    device_id:
      name: sScape place
      required: true
      selector:
        device:
          integration: sscape
    hours:
      name: Lookahead hours
      description: Coverage is rounded outward to whole forecast hours. Missing periods remain unknown.
      default: 6
      selector:
        number:
          min: 1
          max: 24
          step: 1
          mode: box
