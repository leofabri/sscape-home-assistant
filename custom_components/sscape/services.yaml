get_briefing:
  name: Read current briefing
  description: Return the selected place's current assessment for an automation or announcement. Does not operate any device. Administrator access required.
  fields:
    device_id:
      name: sScape place
      required: true
      selector:
        device:
          integration: sscape
get_dashboard:
  name: Generate place dashboard
  description: Return ready-to-import dashboard YAML using the actual entity IDs and native Home Assistant cards. Does not create or overwrite dashboards. Administrator access required.
  fields:
    device_id:
      name: sScape place
      required: true
      selector:
        device:
          integration: sscape
    all_selected_places:
      name: Include all imported places
      description: Overview and detail views for this account's explicitly imported places only.
      default: false
      selector:
        boolean:
    include_optional:
      name: Include optional indicators in preview
      description: Does not enable entities. User-disabled and excluded entities remain excluded.
      default: false
      selector:
        boolean:
    profile:
      name: Detail level
      selector:
        select:
          options:
            - essential
            - detailed
    detail_groups:
      name: Evidence groups
      selector:
        select:
          multiple: true
          options:
            - storm
            - official
            - earthquake
            - thermal
            - winter
            - observations
            - local
test_notification:
  name: Test notifications
  description: Sends an explicit test only. An accepted request does not prove delivery. Administrator only.
  fields:
    notification_target:
      name: Destination
      required: true
      selector:
        text:
test_assist:
  name: Test Assist for a target
  description: Tests the built-in agent response, not voice hardware. Exposure and read permissions apply. Administrator only.
  fields:
    device_id:
      name: sScape place
      required: true
      selector:
        device:
          integration: sscape
get_setup:
  name: Read dashboard setup
  description: List selected targets and scoped entity IDs for the admin setup panel. No API keys, dashboard writes or network requests. Administrator access required.
get_hazards:
  name: Read warnings and events
  description: Current warning, earthquake and thermal evidence with source, times and distances. Catalogues may be partial. Administrator access required.
  fields:
    device_id:
      name: sScape place
      required: true
      selector:
        device:
          integration: sscape
get_outlook:
  name: Read upcoming weather windows
  description: Return cached hourly rain windows, peak one-hour gust timing and coldest hourly estimate. Forecast data, not observations or exact onset times. Administrator access required.
  fields:
    device_id:
      name: sScape place
      required: true
      selector:
        device:
          integration: sscape
    hours:
      name: Lookahead hours
      description: Coverage is rounded outward to whole forecast hours. Missing periods remain unknown.
      default: 6
      selector:
        number:
          min: 1
          max: 24
          step: 1
          mode: box
