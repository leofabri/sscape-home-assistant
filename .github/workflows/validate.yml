name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Home Assistant / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            requirements: requirements-test-min.txt
          - python: "3.14"
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r "${{ matrix.requirements }}"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Offline runtime tests
        run: pytest --timeout=20 --cov=custom_components.sscape --cov-branch
      - name: Verify installable package
        run: python tools/package.py --output /tmp/sscape-home-assistant.zip

  hacs:
    name: HACS repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
